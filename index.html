<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f2f27">
<title>Clan Survival</title>
<style>
  :root{
    --ink:#f8f4e8;
    --ui:#1f2f27;
    --ui2:#31443a;
    --paper:#f6efdf;
    --gold:#d4b063;
    --accent:#93b28b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;background:#15231c;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;height:100%;
  }
  body{touch-action:none}
  #gameWrap{
    position:relative;width:100vw;height:100vh;overflow:hidden;background:#24382d;
  }
  canvas{
    display:block;width:100%;height:100%;
    background:#2f4a3b;
  }

  .hud{
    position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));
    display:flex;justify-content:space-between;gap:10px;pointer-events:none;
  }
  .hudCard{
    background:rgba(20,31,25,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:10px 12px;box-shadow:0 8px 18px rgba(0,0,0,.18);
  }
  #objective{max-width:68%;font-size:14px;line-height:1.25}
  #objective b{display:block;color:#f3d986;font-size:13px;margin-bottom:2px}
  #stats{font-size:13px;text-align:right;min-width:110px}
  #stats strong{font-size:17px;color:#fff}

  .dialogue{
    position:absolute;left:12px;right:12px;bottom:calc(108px + env(safe-area-inset-bottom));
    background:rgba(246,239,223,.97);color:#253229;border-radius:18px;
    padding:14px 16px;border:3px solid #26372d;box-shadow:0 8px 22px rgba(0,0,0,.28);
    display:none;
  }
  .dialogue.show{display:block}
  .speaker{font-weight:900;font-size:17px;margin-bottom:4px}
  .dialogueText{font-size:16px;line-height:1.35}
  .dialogue button{
    margin-top:10px;width:100%;border:0;border-radius:12px;padding:11px 14px;
    background:#496b56;color:white;font-size:16px;font-weight:800;
  }

  .controls{
    position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;
    pointer-events:none;
  }
  .joystick{
    width:104px;height:104px;border-radius:50%;
    background:rgba(30,45,37,.62);border:2px solid rgba(255,255,255,.18);
    position:relative;pointer-events:auto;touch-action:none;
  }
  .stick{
    width:50px;height:50px;border-radius:50%;background:rgba(245,240,225,.9);
    position:absolute;left:27px;top:27px;box-shadow:0 4px 14px rgba(0,0,0,.28);
  }
  .actionStack{display:grid;gap:10px;pointer-events:auto}
  .actionBtn{
    min-width:104px;min-height:50px;border:0;border-radius:16px;
    font-size:16px;font-weight:900;color:white;background:#526f5a;
    box-shadow:0 5px 0 #31473a;
  }
  .actionBtn.secondary{background:#6f6048;box-shadow:0 5px 0 #4c402f}
  .actionBtn:disabled{opacity:.42;box-shadow:none}

  .titleCard{
    position:absolute;inset:0;background:linear-gradient(rgba(20,31,25,.1),rgba(20,31,25,.55));
    display:grid;place-items:center;padding:22px;
  }
  .titlePanel{
    width:min(92vw,520px);background:rgba(246,239,223,.96);color:#223028;
    border-radius:24px;padding:22px;border:4px solid #2b3c31;
    box-shadow:0 14px 32px rgba(0,0,0,.3);text-align:center;
  }
  .titlePanel h1{font-size:36px;margin:0 0 8px}
  .titlePanel p{margin:0 0 14px;line-height:1.4}
  .titlePanel input{
    width:100%;font-size:18px;padding:13px 14px;border-radius:12px;
    border:1px solid #a7a89e;margin:8px 0 12px;
  }
  .titlePanel button{
    width:100%;padding:13px 16px;border:0;border-radius:14px;
    background:#486b52;color:white;font-size:18px;font-weight:900;
  }
  .hint{
    position:absolute;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom));
    background:rgba(20,31,25,.82);padding:8px 12px;border-radius:999px;
    font-size:13px;display:none;white-space:nowrap;
  }
  .hint.show{display:block}

  .mapBtn{
    position:absolute;right:14px;top:calc(92px + env(safe-area-inset-top));
    border:0;border-radius:14px;padding:10px 13px;background:rgba(246,239,223,.94);
    color:#26372d;font-size:15px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.2);
  }
  .mapPanel{
    position:absolute;inset:0;background:rgba(12,20,16,.72);display:none;
    place-items:center;padding:22px;z-index:20;
  }
  .mapPanel.show{display:grid}
  .mapCard{
    width:min(92vw,520px);background:#efe5ca;color:#26372d;border:4px solid #33483a;
    border-radius:24px;padding:16px;box-shadow:0 15px 35px rgba(0,0,0,.35)
  }
  .mapCard h2{margin:0 0 10px}
  .miniMap{
    height:330px;border-radius:18px;position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 52%,#789b6d 0 27%,#4d7358 28% 45%,#294d3b 46%);
    border:3px solid #8b7652;
  }
  .mapLabel{position:absolute;background:#fff9;padding:5px 7px;border-radius:8px;font-size:12px;font-weight:850}
  .mapYou{position:absolute;width:18px;height:18px;border-radius:50%;background:#d88b55;border:3px solid white;box-shadow:0 2px 6px #0005}
  .closeMap{width:100%;margin-top:12px;border:0;border-radius:13px;padding:12px;background:#486b52;color:white;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>
  <button id="mapBtn" class="mapBtn" type="button">🗺️ Map</button>
  <div id="mapPanel" class="mapPanel">
    <div class="mapCard">
      <h2>Territory Map</h2>
      <div id="miniMap" class="miniMap">
        <div class="mapLabel" style="left:38%;top:43%">Camp</div>
        <div class="mapLabel" style="left:38%;top:76%">Forest Path</div>
        <div class="mapLabel" style="left:8%;top:15%">Pine Woods</div>
        <div class="mapLabel" style="right:7%;top:18%">River</div>
        <div class="mapLabel" style="right:7%;bottom:10%">Hunting Meadow</div>
        <div id="mapYou" class="mapYou"></div>
      </div>
      <button id="closeMap" class="closeMap" type="button">Back to game</button>
    </div>
  </div>

  <div class="hud">
    <div id="objective" class="hudCard">
      <b>OBJECTIVE</b>
      Talk to Mossheart, the camp leader.
    </div>
    <div id="stats" class="hudCard">
      <strong id="playerName">Rayapaw</strong><br>
      Prey: <span id="preyCount">0</span>/2
    </div>
  </div>

  <div id="hint" class="hint">Approach a cat or object</div>

  <div id="dialogue" class="dialogue">
    <div id="speaker" class="speaker"></div>
    <div id="dialogueText" class="dialogueText"></div>
    <button id="dialogueBtn" type="button">Continue</button>
  </div>

  <div class="controls">
    <div id="joystick" class="joystick" aria-label="Movement joystick">
      <div id="stick" class="stick"></div>
    </div>
    <div class="actionStack">
      <button id="interactBtn" class="actionBtn" type="button" disabled>Interact</button>
      <button id="pounceBtn" class="actionBtn secondary" type="button" disabled>Pounce</button>
    </div>
  </div>

  <div id="titleCard" class="titleCard">
    <div class="titlePanel">
      <h1>Clan Survival</h1>
      <p>Explore the camp, meet your clan, and survive together.</p>
      <input id="nameInput" value="Rayapaw" maxlength="20" aria-label="Cat name">
      <button id="startBtn" type="button">Enter the camp</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('gameWrap');
  const interactBtn = document.getElementById('interactBtn');
  const pounceBtn = document.getElementById('pounceBtn');
  const objective = document.getElementById('objective');
  const preyCountEl = document.getElementById('preyCount');
  const dialogue = document.getElementById('dialogue');
  const speakerEl = document.getElementById('speaker');
  const dialogueTextEl = document.getElementById('dialogueText');
  const dialogueBtn = document.getElementById('dialogueBtn');
  const titleCard = document.getElementById('titleCard');
  const startBtn = document.getElementById('startBtn');
  const nameInput = document.getElementById('nameInput');
  const playerName = document.getElementById('playerName');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize(){
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const world = {w:1800,h:1300,zone:'camp'};
  const player = {x:900,y:700,r:18,speed:180,name:'Rayapaw',prey:0,quest:false,completed:false};
  let cam = {x:0,y:0};
  let move = {x:0,y:0};
  let last = performance.now();
  let activeTarget = null;
  let dialogueQueue = [];
  let dialogueAction = null;
  let inDialogue = false;

  const campNPCs = [
    {id:'leader',name:'Mossheart',x:900,y:420,color:'#b7774e',role:'Leader',mood:'calm'},
    {id:'healer',name:'Dappleleaf',x:620,y:590,color:'#ded2ba',role:'Healer',mood:'kind'},
    {id:'warrior',name:'Ashstep',x:1150,y:650,color:'#687078',role:'Warrior',mood:'serious'},
    {id:'apprentice',name:'Pipaw',x:760,y:840,color:'#d4a66d',role:'Apprentice',mood:'excited'}
  ];

  const forestPrey = [];
  const preyKinds=['mouse','mouse','mouse','rabbit','mouse','rabbit','mouse','rabbit','mouse','mouse','rabbit','mouse'];
  preyKinds.forEach((kind,i)=>{
    forestPrey.push({
      id:i+1, kind,
      x:260 + (i*137)%1250,
      y:250 + (i*211)%760,
      caught:false, phase:i*.83,
      vx:(i%2?1:-1)*(kind==='rabbit'?48:28),
      vy:((i%3)-1)*(kind==='rabbit'?32:18)
    });
  });

  const trees = [];
  function makeTrees(){
    trees.length = 0;
    for(let i=0;i<46;i++){
      const angle = i * 0.62;
      const radius = 440 + (i%7)*38;
      trees.push({
        x:900 + Math.cos(angle)*radius + ((i%3)-1)*45,
        y:650 + Math.sin(angle)*radius*0.74 + ((i%5)-2)*22,
        s:0.8 + (i%4)*0.12
      });
    }
  }
  makeTrees();

  function drawBackground(){
    if(world.zone==='camp'){
      ctx.fillStyle='#496b53';ctx.fillRect(0,0,W,H);
      drawWorldCircle(900,650,480,'#6f8f65');
      drawWorldCircle(900,650,370,'#789b6d');
      drawPath(900,650,900,1100,120,'#b8a27d');
      drawPath(900,650,1280,900,90,'#b8a27d');
      drawDen(900,300,170,100,'Leader den');
      drawDen(540,520,150,90,'Healer den');
      drawDen(1210,620,160,95,'Warriors');
      drawDen(720,920,150,90,'Apprentices');
      trees.forEach(t=>drawTree(t.x,t.y,t.s));
      drawFreshKill(1030,820);
      drawSign(900,1130,'Forest →');
    }else{
      ctx.fillStyle='#315240';ctx.fillRect(0,0,W,H);
      for(let x=120;x<1700;x+=210){
        for(let y=120;y<1250;y+=190){
          if((x+y)%420!==0) drawTree(x+((y/190)%2)*70,y,1.05);
        }
      }
      drawPath(120,1120,1680,180,110,'#8c7a5c');
      drawSign(160,1120,'← Camp');
      ctx.fillStyle='#6aa2b0';
      ctx.fillRect(worldToScreenX(1380),worldToScreenY(160),220,860);
    }
  }

  function worldToScreenX(x){return x-cam.x}
  function worldToScreenY(y){return y-cam.y}

  function drawWorldCircle(x,y,r,color){
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(worldToScreenX(x),worldToScreenY(y),r,0,Math.PI*2);ctx.fill();
  }

  function drawPath(x1,y1,x2,y2,w,color){
    ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(worldToScreenX(x1),worldToScreenY(y1));ctx.lineTo(worldToScreenX(x2),worldToScreenY(y2));ctx.stroke();
  }

  function drawTree(x,y,s=1){
    const sx=worldToScreenX(x), sy=worldToScreenY(y);
    if(sx<-80||sx>W+80||sy<-120||sy>H+120)return;
    ctx.fillStyle='#5e4531';
    ctx.fillRect(sx-8*s,sy+12*s,16*s,34*s);
    ctx.fillStyle='#2f5a3f';
    ctx.beginPath();ctx.arc(sx,sy,34*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3f7150';
    ctx.beginPath();ctx.arc(sx-20*s,sy+5*s,24*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+20*s,sy+5*s,24*s,0,Math.PI*2);ctx.fill();
  }

  function drawDen(x,y,w,h,label){
    const sx=worldToScreenX(x),sy=worldToScreenY(y);
    ctx.fillStyle='#5b4d3d';
    ctx.beginPath();
    ctx.ellipse(sx,sy,w/2,h/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#27352d';
    ctx.beginPath();ctx.ellipse(sx,sy+12,w*.2,h*.27,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.82)';
    ctx.font='bold 12px -apple-system';ctx.textAlign='center';
    ctx.fillText(label,sx,sy-h*.62);
  }

  function drawFreshKill(x,y){
    const sx=worldToScreenX(x),sy=worldToScreenY(y);
    ctx.fillStyle='#745b42';
    ctx.beginPath();ctx.ellipse(sx,sy,44,24,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d7c9a4';
    ctx.beginPath();ctx.ellipse(sx-9,sy-3,12,7,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(sx+12,sy+4,10,6,0,0,Math.PI*2);ctx.fill();
  }

  function drawSign(x,y,text){
    const sx=worldToScreenX(x),sy=worldToScreenY(y);
    ctx.fillStyle='#70563c';ctx.fillRect(sx-4,sy,8,34);
    ctx.fillStyle='#d8c49c';ctx.fillRect(sx-55,sy-24,110,28);
    ctx.fillStyle='#2b302a';ctx.font='bold 12px -apple-system';ctx.textAlign='center';
    ctx.fillText(text,sx,sy-6);
  }

  function drawCat(x,y,color,name,isPlayer=false){
    const sx=worldToScreenX(x),sy=worldToScreenY(y);
    if(sx<-60||sx>W+60||sy<-60||sy>H+60)return;
    ctx.save();
    ctx.translate(sx,sy);
    ctx.fillStyle='rgba(0,0,0,.16)';
    ctx.beginPath();ctx.ellipse(0,17,24,8,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=color;
    ctx.beginPath();ctx.ellipse(0,3,21,28,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,-20,18,0,Math.PI*2);ctx.fill();

    ctx.beginPath();ctx.moveTo(-13,-31);ctx.lineTo(-6,-45);ctx.lineTo(-1,-31);ctx.fill();
    ctx.beginPath();ctx.moveTo(13,-31);ctx.lineTo(6,-45);ctx.lineTo(1,-31);ctx.fill();

    ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(17,6);ctx.quadraticCurveTo(38,-8,30,-28);ctx.stroke();

    ctx.fillStyle='#f2e6cc';
    ctx.beginPath();ctx.ellipse(0,4,8,15,0,0,Math.PI*2);ctx.fill();

    // Individual markings so clan cats are visually distinct.
    const mark=(name.charCodeAt(0)+name.length)%4;
    if(mark===0){
      ctx.fillStyle='#3d3530';ctx.beginPath();ctx.ellipse(-8,-28,7,5,-.4,0,Math.PI*2);ctx.fill();
    }else if(mark===1){
      ctx.strokeStyle='#55483d';ctx.lineWidth=3;
      [-5,1,7].forEach(xx=>{ctx.beginPath();ctx.moveTo(xx,-36);ctx.lineTo(xx-3,-29);ctx.stroke()});
    }else if(mark===2){
      ctx.fillStyle='#f7efe0';ctx.beginPath();ctx.ellipse(7,-26,6,8,.3,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#59463c';ctx.beginPath();ctx.ellipse(-10,1,6,12,-.2,0,Math.PI*2);ctx.fill();
    }

    ctx.fillStyle=isPlayer?'#6fa7d2':'#a9d075';
    ctx.beginPath();ctx.arc(-6,-21,3.3,0,Math.PI*2);ctx.arc(6,-21,3.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(-6,-21,1.4,0,Math.PI*2);ctx.arc(6,-21,1.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#b56d6d';ctx.beginPath();ctx.arc(0,-15,2.3,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.font='bold 12px -apple-system';ctx.textAlign='center';
    ctx.fillText(name,0,-53);
    ctx.restore();
  }

  function drawPrey(p){
    const bob=Math.sin(performance.now()/300+p.phase)*2;
    const sx=worldToScreenX(p.x),sy=worldToScreenY(p.y+bob);
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)return;
    if(p.kind==='rabbit'){
      ctx.fillStyle='#b9aa92';
      ctx.beginPath();ctx.ellipse(sx,sy,14,10,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+11,sy-5,7,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(sx+9,sy-17,4,12,-.18,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(sx+16,sy-16,4,12,.18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#eee6d7';ctx.beginPath();ctx.arc(sx-13,sy-2,5,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#9b8d7e';
      ctx.beginPath();ctx.ellipse(sx,sy,10,7,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+8,sy-3,5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#9b8d7e';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sx-9,sy);ctx.quadraticCurveTo(sx-22,sy-7,sx-27,sy+3);ctx.stroke();
    }
  }

  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

  function updateTarget(){
    activeTarget=null;
    let best=9999;

    if(world.zone==='camp'){
      campNPCs.forEach(n=>{
        const d=dist(player,n);
        if(d<70 && d<best){best=d;activeTarget={type:'npc',obj:n}}
      });
      const exit={x:900,y:1110};
      const dExit=Math.hypot(player.x-exit.x,player.y-exit.y);
      if(dExit<85 && dExit<best){best=dExit;activeTarget={type:'exit'}}

      const pile={x:1030,y:820};
      const dPile=Math.hypot(player.x-pile.x,player.y-pile.y);
      if(dPile<85 && dPile<best && player.prey>0){best=dPile;activeTarget={type:'pile'}}
    }else{
      forestPrey.forEach(p=>{
        if(p.caught)return;
        const d=dist(player,p);
        if(d<75 && d<best){best=d;activeTarget={type:'prey',obj:p}}
      });
      const campExit={x:160,y:1120};
      const dCamp=Math.hypot(player.x-campExit.x,player.y-campExit.y);
      if(dCamp<90 && dCamp<best){best=dCamp;activeTarget={type:'campExit'}}
    }

    interactBtn.disabled=!(activeTarget && activeTarget.type!=='prey');
    pounceBtn.disabled=!(activeTarget && activeTarget.type==='prey');
    interactBtn.textContent=activeTarget && activeTarget.type==='npc' ? 'Talk' :
      activeTarget && activeTarget.type==='exit' ? 'Go to forest' :
      activeTarget && activeTarget.type==='campExit' ? 'Return to camp' :
      activeTarget && activeTarget.type==='pile' ? 'Drop prey' : 'Interact';
  }

  function setObjective(text){
    objective.innerHTML='<b>OBJECTIVE</b>'+text;
  }

  function showDialogue(name,lines,onDone){
    dialogueQueue=[...lines];
    dialogueAction=onDone||null;
    inDialogue=true;
    speakerEl.textContent=name;
    dialogue.classList.add('show');
    nextDialogueLine();
  }

  function nextDialogueLine(){
    if(dialogueQueue.length){
      dialogueTextEl.textContent=dialogueQueue.shift();
      dialogueBtn.textContent=dialogueQueue.length?'Continue':'Close';
    }else{
      dialogue.classList.remove('show');
      inDialogue=false;
      const fn=dialogueAction;dialogueAction=null;
      if(fn)fn();
    }
  }
  dialogueBtn.addEventListener('click',nextDialogueLine);

  function handleInteract(){
    if(!activeTarget || inDialogue)return;
    if(activeTarget.type==='npc'){
      const n=activeTarget.obj;
      if(n.id==='leader'){
        if(!player.quest){
          showDialogue(n.name,[
            `There you are, ${player.name}. The camp is running low on food.`,
            'Head into the woods and bring back two pieces of prey before sunset.',
            'Stay alert. The forest changes when you stop paying attention.'
          ],()=>{
            player.quest=true;
            setObjective('Hunt 2 pieces of prey in the forest, then return them to camp.');
          });
        }else if(!player.completed){
          showDialogue(n.name,[player.prey>=2?'You have enough prey. Put it on the fresh-kill pile.':'Keep going. The clan is counting on you.']);
        }else{
          showDialogue(n.name,['Good work. You fed the clan today. That is how trust is earned.']);
        }
      }else if(n.id==='healer'){
        showDialogue(n.name,['You look healthy enough. Try not to prove me wrong.']);
      }else if(n.id==='warrior'){
        showDialogue(n.name,['Patrol the edges of camp sometime. Quiet feet notice more.']);
      }else{
        showDialogue(n.name,['I bet I could catch a mouse before you!']);
      }
    }else if(activeTarget.type==='exit'){
      world.zone='forest';player.x=220;player.y=1080;setObjective(player.quest?'Find and catch 2 pieces of prey.':'Explore the forest.');
    }else if(activeTarget.type==='campExit'){
      world.zone='camp';player.x=900;player.y=1060;
    }else if(activeTarget.type==='pile'){
      if(player.prey>=2){
        player.prey-=2;preyCountEl.textContent=player.prey;
        player.completed=true;
        setObjective('Mission complete! Talk to Mossheart.');
        showDialogue('Camp',['You add the prey to the fresh-kill pile. Nearby cats gather gratefully.']);
      }
    }
  }
  interactBtn.addEventListener('click',handleInteract);

  pounceBtn.addEventListener('click',()=>{
    if(!activeTarget || activeTarget.type!=='prey' || inDialogue)return;
    const p=activeTarget.obj;
    if(Math.random()<0.78){
      p.caught=true;player.prey++;
      preyCountEl.textContent=player.prey;
      showDialogue('Hunt',[`You wait... then pounce! You caught a ${p.kind}.`]);
      if(player.prey>=2)setObjective('Return to camp and place the prey on the fresh-kill pile.');
    }else{
      p.x+=90;p.y-=50;
      showDialogue('Hunt',['Too soon! The mouse darts away. Get close and try again.']);
    }
  });

  startBtn.addEventListener('click',()=>{
    player.name=(nameInput.value.trim()||'Rayapaw').slice(0,20);
    playerName.textContent=player.name;
    titleCard.style.display='none';
    showDialogue('Camp',['Morning light spills into the clearing. Cats are already moving between the dens.','Mossheart, the camp leader, is waiting near the leader den.']);
  });

  const mapBtn=document.getElementById('mapBtn');
  const mapPanel=document.getElementById('mapPanel');
  const closeMap=document.getElementById('closeMap');
  const mapYou=document.getElementById('mapYou');
  function updateMapDot(){
    let left,top;
    if(world.zone==='camp'){
      left=50+(player.x-900)/18; top=50+(player.y-650)/15;
    }else{
      left=12+(player.x/world.w)*75; top=62+(player.y/world.h)*30;
    }
    mapYou.style.left=Math.max(3,Math.min(94,left))+'%';
    mapYou.style.top=Math.max(3,Math.min(92,top))+'%';
  }
  mapBtn.addEventListener('click',()=>{updateMapDot();mapPanel.classList.add('show')});
  closeMap.addEventListener('click',()=>mapPanel.classList.remove('show'));

  const joystick=document.getElementById('joystick');
  const stick=document.getElementById('stick');
  let joyId=null,joyCenter={x:0,y:0};

  function joyStart(e){
    const t=e.changedTouches?e.changedTouches[0]:e;
    joyId=t.identifier??'mouse';
    const r=joystick.getBoundingClientRect();
    joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};
    joyMove(e);
  }
  function joyMove(e){
    if(joyId===null)return;
    let t;
    if(e.changedTouches){
      t=[...e.changedTouches].find(x=>x.identifier===joyId);
      if(!t)return;
    }else t=e;
    let dx=t.clientX-joyCenter.x,dy=t.clientY-joyCenter.y;
    const m=Math.hypot(dx,dy),max=34;
    if(m>max){dx=dx/m*max;dy=dy/m*max}
    stick.style.transform=`translate(${dx}px,${dy}px)`;
    move.x=dx/max;move.y=dy/max;
    e.preventDefault();
  }
  function joyEnd(e){
    if(e.changedTouches){
      const match=[...e.changedTouches].some(x=>x.identifier===joyId);
      if(!match)return;
    }
    joyId=null;move.x=move.y=0;stick.style.transform='translate(0,0)';
  }

  joystick.addEventListener('touchstart',joyStart,{passive:false});
  joystick.addEventListener('touchmove',joyMove,{passive:false});
  joystick.addEventListener('touchend',joyEnd,{passive:false});
  joystick.addEventListener('mousedown',joyStart);
  window.addEventListener('mousemove',e=>{if(joyId==='mouse')joyMove(e)});
  window.addEventListener('mouseup',e=>{if(joyId==='mouse')joyEnd(e)});

  function clampPlayer(){
    player.x=Math.max(45,Math.min(world.w-45,player.x));
    player.y=Math.max(45,Math.min(world.h-45,player.y));
    if(world.zone==='camp'){
      const dx=player.x-900,dy=player.y-650;
      const d=Math.hypot(dx,dy);
      if(d>535){
        player.x=900+dx/d*535;player.y=650+dy/d*535;
      }
    }
  }

  function update(dt){
    if(world.zone==='forest'){
      forestPrey.forEach(p=>{
        if(p.caught)return;
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        if(p.x<180||p.x>1570){p.vx*=-1;p.x=Math.max(180,Math.min(1570,p.x))}
        if(p.y<180||p.y>1080){p.vy*=-1;p.y=Math.max(180,Math.min(1080,p.y))}
        // Prey becomes skittish if the player gets close.
        const d=Math.hypot(player.x-p.x,player.y-p.y);
        if(d<150){
          const dx=p.x-player.x,dy=p.y-player.y,m=Math.hypot(dx,dy)||1;
          const flee=p.kind==='rabbit'?95:65;
          p.x+=dx/m*flee*dt;p.y+=dy/m*flee*dt;
        }
      });
    }
    if(!inDialogue && titleCard.style.display==='none'){
      const len=Math.hypot(move.x,move.y)||1;
      player.x += (move.x/len)*player.speed*dt;
      player.y += (move.y/len)*player.speed*dt;
      clampPlayer();
    }
    cam.x += ((player.x-W/2)-cam.x)*Math.min(1,dt*7);
    cam.y += ((player.y-H/2)-cam.y)*Math.min(1,dt*7);
    cam.x=Math.max(0,Math.min(world.w-W,cam.x));
    cam.y=Math.max(0,Math.min(world.h-H,cam.y));
    updateTarget();
  }

  function render(){
    drawBackground();
    if(world.zone==='camp'){
      campNPCs.forEach(n=>drawCat(n.x,n.y,n.color,n.name,false));
    }else{
      forestPrey.forEach(p=>{if(!p.caught)drawPrey(p)});
    }
    drawCat(player.x,player.y,'#c9784e',player.name,true);
  }

  function loop(now){
    const dt=Math.min((now-last)/1000,.035);last=now;
    update(dt);render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
